name: Lean

on:
  push:
    branches: [main]
    paths:
      - "lean/**"
      - "certificate/**"
      - ".github/workflows/lean.yml"
  pull_request:
    branches: [main]
    paths:
      - "lean/**"
      - "certificate/**"
      - ".github/workflows/lean.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Extract generated Lean replay
        shell: bash
        run: |
          rm -rf lean/PopTacToe/Generated
          unzip -q certificate/Generated.zip -d lean/PopTacToe
          test -f lean/PopTacToe/Generated/Root.lean

      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: true
          leanchecker: false
          use-mathlib-cache: false

      - name: Smoke-check published generated replay
        working-directory: lean
        run: lake build PopTacToe.Generated.Rank02.Chunk152

      - name: Check test module
        working-directory: lean
        run: lake env leanchecker PopTacToe.Tests

      - name: Verify certificate manifest metadata
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          p = Path("certificate/manifest.json")
          data = json.loads(p.read_text(encoding="utf-8"))

          assert data["format"] == "poptactoe-certificate-v1"
          assert data["ruleset"] == "torus-continue-all-on-board-king-8-v1"
          assert data["objective"] == "blue-forced-terminal-win-before-travel"
          assert data["stateCount"] == 879896
          assert data["leanToolchain"] == "leanprover/lean4:v4.32.0"
          assert data["certificateSha256"] == "28789eb3b859be0e8999ec224dc946a94b0c3d139d6a577e00e86c52f6573647"
          assert data["rootTheorem"] == "PopTacToe.Generated.Root.initial_blue_forces_win"
          assert data["generatedReplayPublished"] is True

          archive = Path(data["generatedReplayArchive"]["path"])
          assert archive.stat().st_size == data["generatedReplayArchive"]["bytes"]
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert digest == data["generatedReplayArchive"]["sha256"]
          print("manifest and generated replay archive OK")
          PY
