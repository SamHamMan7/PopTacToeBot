name: Lean

on:
  push:
    branches: [main]
    paths:
      - "lean/**"
      - ".github/workflows/lean.yml"
  pull_request:
    branches: [main]
    paths:
      - "lean/**"
      - ".github/workflows/lean.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: true
          leanchecker: false
          use-mathlib-cache: false

      - name: Check environment with leanchecker
        working-directory: lean
        run: lake env leanchecker PopTacToe.Tests
